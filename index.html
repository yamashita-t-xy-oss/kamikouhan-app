<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>🌱 紙工班アプリ</title>
  <!-- 紙吹雪用ライブラリ (Canvas Confetti) -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: #f0f4f8;
      color: #333;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    .container {
      width: 100%;
      max-width: 800px;
      background: #ffffff;
      border-radius: 24px;
      padding: 30px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.05);
      text-align: center;
      position: relative;
    }

    h1 {
      font-size: 2.2rem;
      color: #2c3e50;
      margin-bottom: 15px;
    }

    .subtitle {
      font-size: 1.5rem;
      color: #555;
      margin-bottom: 20px;
    }

    /* 前日の頑張り・気遣いカード */
    .praise-card {
      background-color: #ebf8ff;
      border: 2px solid #90cdf4;
      border-radius: 16px;
      padding: 15px;
      margin-bottom: 20px;
      color: #2b6cb0;
      font-size: 1.2rem;
      font-weight: bold;
      line-height: 1.5;
    }

    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      padding: 20px;
      margin-bottom: 15px;
      font-size: 1.6rem;
      font-weight: bold;
      border: none;
      border-radius: 16px;
      background-color: #e2e8f0;
      color: #2d3748;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 4px 6px rgba(0,0,0,0.05);
    }

    .btn:active {
      transform: scale(0.98);
      opacity: 0.9;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 15px;
      margin-bottom: 20px;
    }

    .screen {
      display: none;
    }

    .screen.active {
      display: block;
    }

    .btn-mood-1 { background-color: #ffe0b2; color: #e65100; }
    .btn-mood-2 { background-color: #e1f5fe; color: #0277bd; }
    .btn-mood-3 { background-color: #f3e5f5; color: #7b1fa2; }
    .btn-mood-4 { background-color: #ffebee; color: #c62828; }

    .task-selector {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
      margin-bottom: 20px;
      background-color: #edf2f7;
      padding: 15px;
      border-radius: 16px;
    }

    .btn-task {
      padding: 12px 20px;
      font-size: 1.2rem;
      border-radius: 12px;
      border: 2px solid #cbd5e0;
      background-color: white;
      color: #4a5568;
      cursor: pointer;
      font-weight: bold;
      transition: all 0.2s ease;
    }

    .btn-task.active {
      background-color: #3182ce;
      color: white;
      border-color: #2b6cb0;
      box-shadow: 0 4px 10px rgba(49, 130, 206, 0.3);
    }

    .count-badge {
      display: inline-block;
      background-color: #feebc8;
      color: #c05621;
      padding: 8px 18px;
      border-radius: 20px;
      font-size: 1.3rem;
      font-weight: bold;
      margin-bottom: 15px;
      border: 2px dashed #dd6b20;
    }

    .btn-done {
      background-color: #4caf50;
      color: white;
      font-size: 2.8rem;
      padding: 35px;
      border-radius: 24px;
      box-shadow: 0 8px 20px rgba(76, 175, 80, 0.4);
      margin-top: 10px;
      margin-bottom: 15px;
    }

    .btn-rest-trigger {
      background-color: #ed8936;
      color: white;
      font-size: 1.8rem;
      padding: 20px;
      border-radius: 18px;
      box-shadow: 0 6px 15px rgba(237, 137, 54, 0.3);
      margin-bottom: 10px;
    }

    .nav-bar {
      display: flex;
      justify-content: space-between;
      margin-top: 25px;
      padding-top: 20px;
      border-top: 2px solid #edf2f7;
    }

    .btn-secondary {
      width: auto;
      padding: 12px 24px;
      font-size: 1.1rem;
      background-color: #cbd5e0;
      color: #4a5568;
    }

    .modal-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: rgba(0, 0, 0, 0.5);
      z-index: 2000;
      justify-content: center;
      align-items: center;
    }

    .modal-overlay.active {
      display: flex;
    }

    .modal-content {
      background: white;
      width: 90%;
      max-width: 500px;
      border-radius: 24px;
      padding: 25px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
      text-align: center;
    }

    .modal-title {
      font-size: 1.8rem;
      color: #2d3748;
      margin-bottom: 20px;
    }

    .btn-break-option {
      font-size: 1.5rem;
      padding: 18px;
      margin-bottom: 12px;
      border-radius: 16px;
      border: none;
      color: white;
      font-weight: bold;
      cursor: pointer;
      width: 100%;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }

    .btn-toilet { background-color: #4299e1; }
    .btn-tea { background-color: #48bb78; }
    .btn-walk { background-color: #ecc94b; color: #744210; }
    .btn-teacher { background-color: #e53e3e; }

    #toast {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      background-color: #2b6cb0;
      color: white;
      padding: 18px 36px;
      border-radius: 30px;
      font-size: 1.4rem;
      font-weight: bold;
      opacity: 0;
      transition: opacity 0.3s ease;
      pointer-events: none;
      box-shadow: 0 6px 18px rgba(0,0,0,0.2);
      z-index: 3000;
      width: 90%;
      max-width: 600px;
    }

    #toast.show {
      opacity: 1;
    }
  </style>
</head>
<body>

  <div id="toast">メッセージ</div>

  <!-- 休憩・SOSポップアップ画面 -->
  <div id="break-modal" class="modal-overlay">
    <div class="modal-content">
      <h2 class="modal-title">☕ なにをしますか？</h2>
      <button class="btn-break-option btn-toilet" onclick="selectBreakOption('🚽 トイレ', this)">🚽 トイレ</button>
      <button class="btn-break-option btn-tea" onclick="selectBreakOption('🍵 お茶', this)">🍵 お茶</button>
      <button class="btn-break-option btn-walk" onclick="selectBreakOption('🚶 散歩', this)">🚶 散歩</button>
      <button class="btn-break-option btn-teacher" onclick="selectBreakOption('🙋 先生を呼ぶ', this)">🙋 先生を呼ぶ</button>
      
      <button class="btn btn-secondary" style="margin-top: 15px; margin-bottom: 0;" onclick="closeBreakModal()">キャンセル</button>
    </div>
  </div>

  <div class="container">

    <!-- 1. 生徒選択画面 -->
    <div id="screen-student" class="screen active">
      <h1>🌱 紙工班アプリ</h1>
      <p class="subtitle">生徒を選んでください</p>
      <div id="student-list" class="grid">
        <p>生徒データを読み込み中...</p>
      </div>
    </div>

    <!-- 2. 朝の気分画面 -->
    <div id="screen-mood-morning" class="screen">
      <h1 id="morning-title">おはよう！</h1>
      <div id="praise-card" class="praise-card" style="display: none;"></div>
      <p class="subtitle">今日の気分は？</p>
      <div class="grid">
        <button class="btn btn-mood-1" onclick="selectMorningMood('😀 元気', this)">😀 元気</button>
        <button class="btn btn-mood-2" onclick="selectMorningMood('🙂 ふつう', this)">🙂 ふつう</button>
        <button class="btn btn-mood-3" onclick="selectMorningMood('😔 つかれた', this)">😔 つかれた</button>
        <button class="btn btn-mood-4" onclick="selectMorningMood('😣 しんどい', this)">😣 しんどい</button>
      </div>
      <div class="nav-bar">
        <button class="btn btn-secondary" onclick="showScreen('screen-student')">⬅ 生徒選択へもどる</button>
      </div>
    </div>

    <!-- 3. 作業画面（できた！ ＆ 休憩） -->
    <div id="screen-work" class="screen">
      <h1 id="work-title">今日の作業</h1>
      
      <div id="done-counter" class="count-badge">きょうの『できた！』: 0 回 🌟</div>

      <p style="font-size: 1.1rem; color: #718096; margin-bottom: 8px;">▼ やる作業をえらんでね</p>
      <div id="task-selector" class="task-selector"></div>

      <p id="work-detail" class="subtitle" style="font-weight: bold; color: #2b6cb0; margin-bottom: 15px;"></p>
      
      <button class="btn btn-done" onclick="submitWorkLog(this)">🌟 できた！</button>

      <button class="btn btn-rest-trigger" onclick="openBreakModal()">☕ 休憩・たすけて</button>

      <div class="nav-bar">
        <button class="btn btn-secondary" onclick="resetApp()">⬅ 生徒選択へもどる</button>
        <button class="btn btn-secondary" style="background-color: #ed8936; color: white;" onclick="showScreen('screen-mood-evening')">帰りの気分へ ➔</button>
      </div>
    </div>

    <!-- 4. 帰りの気分画面 -->
    <div id="screen-mood-evening" class="screen">
      <h1 id="evening-title">今日もおつかれさま！</h1>
      <p class="subtitle">今日の作業はどうでしたか？</p>
      <div class="grid">
        <button class="btn btn-mood-1" onclick="selectEveningMood('😀 楽しかった', this)">😀 楽しかった</button>
        <button class="btn btn-mood-2" onclick="selectEveningMood('🙂 がんばれた', this)">🙂 がんばれた</button>
        <button class="btn btn-mood-2" onclick="selectEveningMood('😐 ふつう', this)">😐 ふつう</button>
        <button class="btn btn-mood-3" onclick="selectEveningMood('😔 つかれた', this)">😔 つかれた</button>
        <button class="btn btn-mood-4" onclick="selectEveningMood('😣 しんどかった', this)">😣 しんどかった</button>
      </div>
      <div class="nav-bar">
        <button class="btn btn-secondary" onclick="showScreen('screen-work')">⬅ 作業画面へ</button>
        <button class="btn btn-secondary" onclick="resetApp()">最初にもどる 🏠</button>
      </div>
    </div>

  </div>

  <script>
    const GAS_API_URL = "https://script.google.com/macros/s/AKfycbxOHi9Ie-WJqNpGzWMA0Wvva-uSblF6SKSrW5QH7p-myLH1JZZbs9PJMxbKkEolVL2UJg/exec";

    let currentStudent = null;
    let currentTaskIndex = 0;
    let isSubmitting = false; 
    let todayDoneCount = 0;

    const praiseMessages = [
      "すごーい！かんぺき！",
      "そのちょうし！素晴らしいよ！",
      "ばっちり！かっこいい！",
      "すごい集中力！えらい！",
      "よくがんばったね！つぎも応援してるよ！"
    ];

    function playFanfare() {
      try {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        const ctx = new AudioContext();
        
        const notes = [261.63, 329.63, 392.00, 523.25];
        const times = [0, 0.12, 0.24, 0.36];
        const durations = [0.1, 0.1, 0.1, 0.4];

        notes.forEach((freq, idx) => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(freq, ctx.currentTime + times[idx]);
          
          gain.gain.setValueAtTime(0.3, ctx.currentTime + times[idx]);
          gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + times[idx] + durations[idx]);
          
          osc.connect(gain);
          gain.connect(ctx.destination);
          
          osc.start(ctx.currentTime + times[idx]);
          osc.stop(ctx.currentTime + times[idx] + durations[idx]);
        });
      } catch (e) {
        console.log("Audio error:", e);
      }
    }

    function triggerConfetti() {
      if (typeof confetti === 'function') {
        confetti({
          particleCount: 80,
          spread: 70,
          origin: { y: 0.6 }
        });
      }
    }

    function speakText(text) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const uttr = new SpeechSynthesisUtterance(text);
        uttr.lang = 'ja-JP';
        uttr.rate = 0.92; // より優しくハッキリ
        uttr.pitch = 1.15;
        window.speechSynthesis.speak(uttr);
      }
    }

    function getTodayKey() {
      return "morning_done_" + new Date().toLocaleDateString('ja-JP');
    }

    function getMorningDoneList() {
      const data = localStorage.getItem(getTodayKey());
      return data ? JSON.parse(data) : [];
    }

    function markMorningDone(studentName) {
      const list = getMorningDoneList();
      if (!list.includes(studentName)) {
        list.push(studentName);
        localStorage.setItem(getTodayKey(), JSON.stringify(list));
      }
    }

    function saveLastDoneCount(studentName, count) {
      if (count > 0) {
        localStorage.setItem("last_count_" + studentName, count);
      }
    }

    function getLastDoneCount(studentName) {
      return localStorage.getItem("last_count_" + studentName) || 0;
    }

    window.onload = () => {
      fetchStudentMaster();
    };

    function showScreen(screenId) {
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
      document.getElementById(screenId).classList.add('active');
    }

    function showToastAndSpeak(message, speakMsg = null, duration = 3200) {
      const toast = document.getElementById('toast');
      toast.innerText = message;
      toast.classList.add('show');
      
      const speechText = speakMsg || message.replace(/[🌟✨🎉🌈💪😀🙂😔😣🚽🍵🚶🙋]/g, '');
      speakText(speechText);

      setTimeout(() => toast.classList.remove('show'), duration);
    }

    async function fetchStudentMaster() {
      try {
        const response = await fetch(GAS_API_URL);
        const students = await response.json();
        
        const container = document.getElementById('student-list');
        container.innerHTML = '';

        students.forEach(student => {
          const btn = document.createElement('button');
          btn.className = 'btn';
          btn.innerText = student.name;
          btn.onclick = () => selectStudent(student);
          container.appendChild(btn);
        });
      } catch (error) {
        console.error("生徒データの取得失敗:", error);
        showToastAndSpeak("生徒データの読み込みに失敗しました");
      }
    }

    function selectStudent(student) {
      currentStudent = student;
      todayDoneCount = 0;
      
      const tasks = student.task.split(/[,、]/).map(t => t.trim());
      currentStudent.taskList = tasks;
      currentTaskIndex = 0;

      document.getElementById('morning-title').innerText = `${student.name}さん、おはよう！`;
      document.getElementById('work-title').innerText = `${student.name}さんの作業`;
      document.getElementById('evening-title').innerText = `${student.name}さん、おつかれさま！`;
      document.getElementById('done-counter').innerText = `きょうの『できた！』: 0 回 🌟`;

      const lastCount = getLastDoneCount(student.name);
      const praiseCard = document.getElementById('praise-card');
      
      if (lastCount > 0) {
        praiseCard.style.display = "block";
        praiseCard.innerText = `前回は ${lastCount} 回も作業ができたね！素晴らしい！今日も応援しているよ！`;
      } else {
        praiseCard.style.display = "none";
      }

      renderTaskButtons();

      const morningDoneList = getMorningDoneList();
      if (morningDoneList.includes(student.name)) {
        showScreen('screen-work');
        speakText(`${student.name}さん、今日も作業をがんばろうね！`);
      } else {
        showScreen('screen-mood-morning');
        let morningVoice = `${student.name}さん、おはよう！今日の気分はどうかな？`;
        if (lastCount > 0) {
          morningVoice = `${student.name}さん、おはよう！前回は${lastCount}回もできたね！今日も応援してるよ！`;
        }
        speakText(morningVoice);
      }
    }

    function renderTaskButtons() {
      const container = document.getElementById('task-selector');
      container.innerHTML = '';

      currentStudent.taskList.forEach((taskName, index) => {
        const btn = document.createElement('button');
        btn.className = `btn-task ${index === currentTaskIndex ? 'active' : ''}`;
        btn.innerText = taskName;
        btn.onclick = () => {
          currentTaskIndex = index;
          renderTaskButtons();
        };
        container.appendChild(btn);
      });

      const activeTask = currentStudent.taskList[currentTaskIndex];
      document.getElementById('work-detail').innerText = `${activeTask}（${currentStudent.value}${currentStudent.unit}）`;
    }

    // 朝の気分選択
    async function selectMorningMood(mood, btnElement) {
      if (isSubmitting) return;
      isSubmitting = true;

      let toastMessage = "きぶんをきろくしたよ！";
      let voiceMessage = "きぶんをきろくしたよ！今日もよろしくね！";

      if (mood.includes('元気')) {
        toastMessage = "元気いっぱいだね！その調子！";
        voiceMessage = "元気いっぱいだね！今日も楽しくがんばろう！";
      } else if (mood.includes('ふつう')) {
        toastMessage = "自分のペースで進めようね！";
        voiceMessage = "自分のペースで、ゆっくり進めようね！";
      } else if (mood.includes('つかれた') || mood.includes('しんどい')) {
        toastMessage = "無理しないで、やすみやすみやろうね！";
        voiceMessage = "無理しないでね。今日は休み休み、少しずつ進めようね！";
      }

      const now = new Date();
      const payload = {
        action: "saveMood",
        studentName: currentStudent.name,
        mood: mood,
        date: now.toLocaleDateString('ja-JP'),
        time: now.toLocaleTimeString('ja-JP', { hour: '2-digit', minute: '2-digit' })
      };

      markMorningDone(currentStudent.name);
      sendData(payload);

      showToastAndSpeak(toastMessage, voiceMessage, 3000);

      setTimeout(() => {
        isSubmitting = false;
        resetApp();
      }, 3000);
    }

    // 🌟 できた！
    async function submitWorkLog(btnElement) {
      if (isSubmitting) return;
      isSubmitting = true;

      playFanfare();
      triggerConfetti();

      todayDoneCount++;
      document.getElementById('done-counter').innerText = `きょうの『できた！』: ${todayDoneCount} 回 🌟`;
      saveLastDoneCount(currentStudent.name, todayDoneCount);

      const randomPraise = praiseMessages[Math.floor(Math.random() * praiseMessages.length)];

      const now = new Date();
      const activeTask = currentStudent.taskList[currentTaskIndex];

      const payload = {
        action: "saveWorkLog",
        studentName: currentStudent.name,
        task: activeTask,
        value: currentStudent.value,
        unit: currentStudent.unit,
        dateTime: now.toLocaleString('ja-JP')
      };

      sendData(payload);

      showToastAndSpeak(`🌟 ${randomPraise}`, randomPraise, 2800);

      setTimeout(() => {
        isSubmitting = false;
        resetApp();
      }, 2800);
    }

    function openBreakModal() {
      document.getElementById('break-modal').classList.add('active');
    }

    function closeBreakModal() {
      document.getElementById('break-modal').classList.remove('active');
    }

    // ☕ 休憩・SOS ➔ 行動のナビゲーション（具体的な伝え方の声をかける）
    function selectBreakOption(optionName, btnElement) {
      if (isSubmitting) return;
      isSubmitting = true;

      closeBreakModal();

      let praiseMsg = "";
      let voiceMsg = "";

      if (optionName.includes('トイレ')) {
        praiseMsg = "🚽 先生に「トイレに行ってきます」と言ってから行こうね！";
        voiceMsg = "先生に、トイレに行ってきます、と言ってから行こうね！";
      } else if (optionName.includes('お茶')) {
        praiseMsg = "🍵 先生に「お茶を飲みます」と言ってから飲もうね！";
        voiceMsg = "先生に、お茶を飲みます、と言ってから飲もうね！";
      } else if (optionName.includes('散歩')) {
        praiseMsg = "🚶 先生に「散歩に行ってきます」と言ってから行こうね！";
        voiceMsg = "先生に、散歩に行ってきます、と言ってから行こうね！";
      } else if (optionName.includes('先生を呼ぶ')) {
        praiseMsg = "🙋 「せんせい」と呼べたね！先生が来るまで待ってね！";
        voiceMsg = "せんせい！呼べたね、えらいよ！先生が来るまでちょっと待ってね！";
        speakText("せんせい"); // まず「せんせい」と発声
      }
      
      const now = new Date();
      const payload = {
        action: "saveWorkLog",
        studentName: currentStudent.name,
        task: `【休憩・要望】${optionName}`,
        value: 0,
        unit: "回",
        dateTime: now.toLocaleString('ja-JP')
      };

      sendData(payload);

      // 「せんせい」呼び出しのときは少し遅らせてナビ音声を入れる
      if (optionName.includes('先生を呼ぶ')) {
        setTimeout(() => {
          showToastAndSpeak(praiseMsg, voiceMsg, 3500);
        }, 1200);
      } else {
        showToastAndSpeak(praiseMsg, voiceMsg, 3500);
      }

      setTimeout(() => {
        isSubmitting = false;
        resetApp();
      }, 4000); // 声をしっかり聞き取れるよう4秒待機
    }

    // 帰りの気分 ➔ 片付け・帰宅への行動促し
    async function selectEveningMood(mood, btnElement) {
      if (isSubmitting) return;
      isSubmitting = true;

      const now = new Date();
      const payload = {
        action: "saveEndMood",
        studentName: currentStudent.name,
        mood: mood,
        date: now.toLocaleDateString('ja-JP'),
        comment: ""
      };

      sendData(payload);

      const toastMsg = "今日もおつかれさま！片付けをして気をつけて帰ろうね！";
      const voiceMsg = `${currentStudent.name}さん、今日もおつかれさま！よく頑張ったね！片付けをして、気をつけて帰ろうね！`;

      showToastAndSpeak(toastMsg, voiceMsg, 3500);

      setTimeout(() => {
        isSubmitting = false;
        resetApp();
      }, 3800);
    }

    function sendData(payload) {
      fetch(GAS_API_URL, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      })
      .catch(error => {
        console.error("送信エラー:", error);
      });
    }

    function resetApp() {
      currentStudent = null;
      showScreen('screen-student');
    }
  </script>
</body>
</html>
